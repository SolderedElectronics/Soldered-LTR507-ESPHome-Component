# Reads ambient light (lux) and proximity from the Soldered LTR-507 breakout every 5 seconds.
# Proximity needs an external IR LED (not on the board): LED cathode (-) -> VLED, LED anode (+) -> VCC.
# Without it proximity always reads 0. See README.

esphome:
  name: soldered-ltr507-basic

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [soldered_ltr507]

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: soldered_ltr507
    address: 0x3A
    update_interval: 5s
    ambient_light:
      name: "Ambient Light"
    proximity:
      name: "Proximity"
